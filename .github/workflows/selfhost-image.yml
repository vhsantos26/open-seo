# Builds the production self-host image on the CI runner and pushes it to GHCR.
# Building here (not on the deployment host) keeps the heavy SSR build off a
# memory-constrained VPS. Images are tagged immutably by date+sha and by long
# sha; production should pin by digest, never by a moving tag.
name: Self-host image

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: selfhost-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Uses the built-in GITHUB_TOKEN (packages: write). No PAT needed to push.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=prod-{{date 'YYYYMMDD'}}-{{sha}}
            type=sha,format=long

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image digest
        run: echo "Pushed ${{ github.repository }}@${{ steps.build.outputs.digest }}"
