"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "corepack enable && pnpm install --frozen-lockfile"
run_mode = "concurrent"

[scripts.run.dev]
available_in = [ "local" ]
command = "pnpm dev -- --port $CONDUCTOR_PORT"
default = true
icon = "play"

[scripts.run.test]
command = "pnpm test"
icon = "test-tube"

[scripts.run.check]
command = "pnpm ci:check"
icon = "circle-check"
